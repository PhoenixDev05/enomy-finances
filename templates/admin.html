<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enomy Finances | Customers</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/template.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/customers.css') }}">
    <script src="static/js/admin.js" defer></script>

</head>
<body>
    {% include 'navbar.html'%}
    <div class="content">
        <h2>EnomyFinances | Admin Panel</h2>
        <div class="row">
            <div class="customerTable">
                <table>
                    <thead>
                        <tr>
                            <th>StaffID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>LastLogin</th>
                    </tr>
                    </thead>
                    <tbody id="cusData">

                    </tbody>
                </table>
            </div>
            <div class="cusDetails">
                <h3>Staff Info</h3>
                <div class="cusForm">
                    <div class="recordRow">
                        <label for="staffID">Staff ID:</label>
                        <input type="text" name="staffID" readonly="true">
                    </div>
                    <div class="recordRow">
                        <label for="username">Username:</label>
                        <input type="text" name="username">
                    </div>
                    <div class="recordRow">
                        <label for="firstName">First Name:</label>
                        <input type="text" name="firstName">
                    </div>
                    <div class="recordRow">
                        <label for="lastName">Last Name:</label>
                        <input type="text" name="lastName">
                    </div>
                    <div class="recordRow">
                        <label for="email">Email:</label>
                        <input type="email" name="email">
                    </div>
                    <div class="recordRow">
                        <label for="password">Password: </label>
                        <input type="password" name="password"> 
                    </div>
                    <div class="recordRow">
                        <label for="created">Account Created:</label>
                        <input type="text" name="created" readonly="true">
                    </div>
                    <div class="recordRow">
                        <label for="lastLogin">Last Login:</label>
                        <input type="text" name="lastLogin" readonly="true">
                    </div>
                    <button id="modButton">Modify</button>
                    <button id="addButton">Add</button>
                    <button id="clearButton" >Clear Entries</button>
                    <br>
                    <p id="message"></p>
                </div>
                
            </div>
        </div>
    </div>
    
</body>
</html>
